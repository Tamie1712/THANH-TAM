<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连字成句游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #2575fc;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .sentence-area {
            background-color: #f8f9fa;
            border: 2px dashed #6a11cb;
            border-radius: 15px;
            min-height: 120px;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        
        .sentence-word {
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 1.4rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: popIn 0.3s ease;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .cards-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .card {
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        
        .card.used {
            background: linear-gradient(135deg, #b8b8b8 0%, #8a8a8a 100%);
            transform: scale(0.9);
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            animation: celebrate 1s ease;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            animation: shake 0.5s ease;
        }
        
        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .hint {
            color: #6a11cb;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .score {
            color: #2575fc;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .card {
                width: 65px;
                height: 65px;
                font-size: 1.5rem;
            }
            
            .sentence-word {
                padding: 10px 14px;
                font-size: 1.2rem;
            }
            
            .buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>连字成句</h1>
        <p class="subtitle">点击汉字卡片，按正确顺序组成完整句子</p>
        
        <div class="score">成功次数: <span id="successCount">0</span></div>
        
        <div class="game-area">
            <div class="sentence-area" id="sentenceArea">
                <p>点击下方汉字开始组句...</p>
            </div>
            
            <div class="cards-area" id="cardsArea">
                <!-- 汉字卡片将通过JavaScript动态生成 -->
            </div>
            
            <div class="buttons">
                <button id="checkBtn">检查答案</button>
                <button id="resetBtn">重新开始</button>
            </div>
            
            <div class="message" id="message">
                <!-- 提示信息将在这里显示 -->
            </div>
            
            <p class="hint">提示：请按正确顺序点击汉字卡片组成句子</p>
        </div>
    </div>

    <script>
        // 游戏数据
        const characters = ['我', '今', '天', '想', '在', '家', '休', '息'];
        const correctSentence = '我今天想在家休息';
        
        // 游戏状态
        let selectedCharacters = [];
        let shuffledCharacters = [];
        let successCount = 0;
        
        // DOM元素
        const cardsArea = document.getElementById('cardsArea');
        const sentenceArea = document.getElementById('sentenceArea');
        const checkBtn = document.getElementById('checkBtn');
        const resetBtn = document.getElementById('resetBtn');
        const message = document.getElementById('message');
        const successCountElement = document.getElementById('successCount');
        
        // 初始化游戏
        function initGame() {
            selectedCharacters = [];
            shuffledCharacters = [...characters].sort(() => Math.random() - 0.5);
            renderCards();
            renderSentence();
            message.textContent = '';
            message.className = 'message';
        }
        
        // 渲染卡片
        function renderCards() {
            cardsArea.innerHTML = '';
            shuffledCharacters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = char;
                card.addEventListener('click', () => selectCharacter(char, card));
                cardsArea.appendChild(card);
            });
        }
        
        // 选择汉字
        function selectCharacter(char, cardElement) {
            // 检查是否已经使用过
            if (cardElement.classList.contains('used')) {
                return;
            }
            
            // 添加到已选数组
            selectedCharacters.push(char);
            
            // 标记为已使用
            cardElement.classList.add('used');
            
            // 更新句子显示
            renderSentence();
        }
        
        // 渲染句子区域
        function renderSentence() {
            sentenceArea.innerHTML = '';
            
            if (selectedCharacters.length === 0) {
                sentenceArea.innerHTML = '<p>点击下方汉字开始组句...</p>';
                return;
            }
            
            selectedCharacters.forEach(char => {
                const wordElement = document.createElement('div');
                wordElement.className = 'sentence-word';
                wordElement.textContent = char;
                sentenceArea.appendChild(wordElement);
            });
        }
        
        // 检查答案
        function checkAnswer() {
            const userSentence = selectedCharacters.join('');
            
            if (userSentence === correctSentence) {
                message.textContent = '恭喜你！句子正确！';
                message.className = 'message success';
                successCount++;
                successCountElement.textContent = successCount;
                
                // 禁用所有卡片
                document.querySelectorAll('.card').forEach(card => {
                    card.classList.add('used');
                });
            } else {
                message.textContent = '句子不正确，请重新尝试！';
                message.className = 'message error';
                
                // 延迟后重置游戏
                setTimeout(() => {
                    initGame();
                }, 1500);
            }
        }
        
        // 事件监听
        checkBtn.addEventListener('click', checkAnswer);
        resetBtn.addEventListener('click', initGame);
        
        // 启动游戏
        initGame();
    </script>
</body>
</html>
